<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced32BandEq - Studio Pro DSP</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0b0f17;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  height: 54px;
  background: #111722;
  border-bottom: 1px solid #1e293b;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { font-weight: 700; letter-spacing: 1px; color: #38bdf8; font-size: 14px; }
.nav-links a {
  color: #94a3b8;
  text-decoration: none;
  font-size: 12px;
  margin-left: 14px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
}
.nav-links a:hover, .nav-links a.active {
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.12);
  border-color: rgba(56, 189, 248, 0.35);
}
main { flex: 1; padding: 24px; max-width: 1280px; width: 100%; margin: 0 auto; }
.panel {
  background: #121824;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.45);
}
h1, h2, h3 { color: #f8fafc; letter-spacing: 0.5px; }
.cyan { color: #22d3ee; }
.amber { color: #fbbf24; }
.btn {
  background: rgba(34, 211, 238, 0.15);
  color: #22d3ee;
  border: 1px solid rgba(34, 211, 238, 0.4);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.btn:hover { background: rgba(34, 211, 238, 0.25); }
.btn-amber {
  background: rgba(251, 191, 36, 0.15);
  color: #fbbf24;
  border: 1px solid rgba(251, 191, 36, 0.4);
}
footer {
  height: 48px;
  background: #111722;
  border-top: 1px solid #1e293b;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #94a3b8;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #090d14;
  border: 1px solid #1e293b;
  padding: 4px 10px;
  border-radius: 999px;
  font-family: monospace;
}
.dot-cyan { width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
.dot-amber { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
input[type="range"] { accent-color: #22d3ee; cursor: pointer; }

</style>
</head>
<body>
  <header>
    <div class="brand">STUDIO PRO DSP WORKSTATION</div>
    <nav class="nav-links">
      <a href="../index.html" class="">Dashboard</a>
      <a href="../views/now_playing.html" class="">Now Playing</a>
      <a href="../views/mix_pad.html" class="active">Mix Pad</a>
      <a href="../views/dolby_atmos.html" class="">Dolby Atmos</a>
      <a href="../views/master_mix_config.html" class="">Master & Config</a>
    </nav>
  </header>
  <main>
    <div class="panel" style="max-width:1050px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:12px; margin-bottom:16px;">
        <h2 style="font-size:16px;">ADVANCED 32-BAND 1/3-OCTAVE GRAPHIC EQ</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="resetSliders()">FLAT / RESET</button>
          <a href="../index.html" class="btn" style="text-decoration:none;">✕</a>
        </div>
      </div>
      <div id="eq32" style="display:flex; justify-content:space-between; gap:4px; background:#090d14; border:1px solid #1e293b; border-radius:10px; padding:16px; overflow-x:auto;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:12px;">
        <span>Preamp Gain: <strong class="amber">+3.0 dB</strong></span>
        <span>Q-Width: <strong class="cyan">Constant-Q 1/3 Octave</strong></span>
      </div>
    </div>
    </main>
  <footer>
    <div>
      <span class="pill"><span class="dot-cyan"></span> [EQ ON - CYA]</span>
      <span class="pill"><span class="dot-amber"></span> [COMP ACTIVE - AMB]</span>
      <span class="pill"><span class="dot-amber"></span> [LIMITER ON - CYA]</span>
      <span class="pill"><span class="dot-cyan"></span> [SPATIAL DUAL - AMB]</span>
    </div>
    <div style="font-family: monospace;">96.0 kHz / 24-Bit | -14.0 LUFS</div>
  </footer>
  <script>
    const freqs = ['20','25','31.5','40','50','63','80','100','125','160','200','250','315','400','500','630','800','1k','1.25k','1.6k','2k','2.5k','3.15k','4k','5k','6.3k','8k','10k','12.5k','16k','20k'];
    const wrap = document.getElementById('eq32');
    freqs.forEach(f => {
      const col = document.createElement('div');
      col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:8px; min-width:24px;';
      col.innerHTML = `<input type="range" class="g32" min="-12" max="12" step="0.5" value="0" style="writing-mode:vertical-lr; direction:rtl; height:170px;" /><span style="font-size:9px; font-family:monospace; color:#94a3b8;">${f}</span>`;
      wrap.appendChild(col);
    });
    function resetSliders(){ document.querySelectorAll('.g32').forEach(s => s.value = 0); }
    </script>
</body>
</html>
