<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LimiterModal - Studio Pro DSP</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0b0f17;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  height: 54px;
  background: #111722;
  border-bottom: 1px solid #1e293b;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { font-weight: 700; letter-spacing: 1px; color: #38bdf8; font-size: 14px; }
.nav-links a {
  color: #94a3b8;
  text-decoration: none;
  font-size: 12px;
  margin-left: 14px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
}
.nav-links a:hover, .nav-links a.active {
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.12);
  border-color: rgba(56, 189, 248, 0.35);
}
main { flex: 1; padding: 24px; max-width: 1280px; width: 100%; margin: 0 auto; }
.panel {
  background: #121824;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.45);
}
h1, h2, h3 { color: #f8fafc; letter-spacing: 0.5px; }
.cyan { color: #22d3ee; }
.amber { color: #fbbf24; }
.btn {
  background: rgba(34, 211, 238, 0.15);
  color: #22d3ee;
  border: 1px solid rgba(34, 211, 238, 0.4);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.btn:hover { background: rgba(34, 211, 238, 0.25); }
.btn-amber {
  background: rgba(251, 191, 36, 0.15);
  color: #fbbf24;
  border: 1px solid rgba(251, 191, 36, 0.4);
}
footer {
  height: 48px;
  background: #111722;
  border-top: 1px solid #1e293b;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #94a3b8;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #090d14;
  border: 1px solid #1e293b;
  padding: 4px 10px;
  border-radius: 999px;
  font-family: monospace;
}
.dot-cyan { width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
.dot-amber { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
input[type="range"] { accent-color: #22d3ee; cursor: pointer; }

</style>
</head>
<body>
  <header>
    <div class="brand">STUDIO PRO DSP WORKSTATION</div>
    <nav class="nav-links">
      <a href="../index.html" class="">Dashboard</a>
      <a href="../views/now_playing.html" class="">Now Playing</a>
      <a href="../views/mix_pad.html" class="">Mix Pad</a>
      <a href="../views/dolby_atmos.html" class="">Dolby Atmos</a>
      <a href="../views/master_mix_config.html" class="active">Master & Config</a>
    </nav>
  </header>
  <main>
    <div class="panel" style="max-width:860px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:12px; margin-bottom:16px;">
        <h2 style="font-size:16px;">TRUE PEAK BRICKWALL LIMITER MODAL</h2>
        <a href="../index.html" class="btn" style="text-decoration:none;">✕</a>
      </div>
      <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:16px;">
        <div style="background:#090d14; border:1px solid #1e293b; border-radius:10px; padding:16px;">
          <div style="font-size:11px; color:#94a3b8; margin-bottom:10px;">GAIN REDUCTION & WAVEFORM HISTORY</div>
          <svg viewBox="0 0 500 160" style="width:100%; height:160px;">
            <polyline points="0,30 60,30 90,75 130,30 210,30 245,95 290,30 400,30 435,60 500,30" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
            <polyline points="0,130 50,90 100,140 160,80 220,135 280,85 350,130 420,95 500,125" fill="none" stroke="#22d3ee" stroke-width="2"/>
          </svg>
        </div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div class="panel" style="padding:12px;">
            <label style="font-size:11px; color:#94a3b8;">OUTPUT CEILING: <span class="amber" id="cVal">-1.0 dBTP</span></label>
            <input type="range" min="-6" max="0" step="0.1" value="-1.0" oninput="document.getElementById('cVal').textContent=this.value+' dBTP'" style="width:100%; margin-top:6px;" />
          </div>
          <div class="panel" style="padding:12px;">
            <label style="font-size:11px; color:#94a3b8;">LOOKAHEAD: <span class="cyan" id="lVal">4.0 ms</span></label>
            <input type="range" min="0" max="10" step="0.5" value="4.0" oninput="document.getElementById('lVal').textContent=this.value+' ms'" style="width:100%; margin-top:6px;" />
          </div>
          <div class="panel" style="padding:12px;">
            <label style="font-size:11px; color:#94a3b8;">RELEASE CURVE: <span class="cyan" id="rVal">120 ms</span></label>
            <input type="range" min="10" max="500" step="5" value="120" oninput="document.getElementById('rVal').textContent=this.value+' ms'" style="width:100%; margin-top:6px;" />
          </div>
        </div>
      </div>
    </div>
    </main>
  <footer>
    <div>
      <span class="pill"><span class="dot-cyan"></span> [EQ ON - CYA]</span>
      <span class="pill"><span class="dot-amber"></span> [COMP ACTIVE - AMB]</span>
      <span class="pill"><span class="dot-amber"></span> [LIMITER ON - CYA]</span>
      <span class="pill"><span class="dot-cyan"></span> [SPATIAL DUAL - AMB]</span>
    </div>
    <div style="font-family: monospace;">96.0 kHz / 24-Bit | -14.0 LUFS</div>
  </footer>
  <script></script>
</body>
</html>
